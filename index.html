<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog & Stok Plastik</title>
  <!-- Tailwind CSS CDN untuk Tampilan Modern & Responsive -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-3 md:p-6">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
    
    <!-- Header App -->
    <div class="bg-blue-900 p-5 text-white">
      <h1 class="text-xl font-bold tracking-wide">📦 Database Stok & Harga Plastik</h1>
      <p class="text-xs text-blue-200 mt-1">Cek Modal, Harga Jual, Untung, dan Stok secara realtime</p>
    </div>

    <div class="p-4 md:p-6">
      <!-- Search Bar & Filter -->
      <div class="relative mb-5">
        <input type="text" id="searchInput" onkeyup="filterData()" 
               placeholder="Cari barang (contoh: PE, 12x22, Kharisma, Kantong)..." 
               class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition text-sm">
        <span class="absolute left-3 top-3.5 text-slate-400">🔍</span>
      </div>

      <!-- Indicator Loading -->
      <div id="loading" class="flex flex-col items-center justify-center py-10 space-y-3">
        <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-slate-500 font-medium">Memuat data dari Google Sheets...</p>
      </div>

      <!-- Container Daftar Barang -->
      <div id="itemList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    // =========================================================
    // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
    // =========================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbx_ySVl1wIzuMkMjwXgiLEZUeGsr8kjSZFP5CYixG-lm6qvJrQeYhQRU8GADvAlqZdI/exec"; 

    let masterData = [];

    // Fungsi Mengambil Data dari API
    async function loadData() {
      const loadingEl = document.getElementById('loading');
      try {
        const response = await fetch(API_URL, { redirect: 'follow' });
        const data = await response.json();

        if (data.status === "error") {
          loadingEl.innerHTML = `<p class="text-red-500 text-sm font-semibold">Error Server: ${data.message}</p>`;
          return;
        }

        masterData = data;
        loadingEl.classList.add('hidden');
        renderData(masterData);

      } catch (err) {
        loadingEl.innerHTML = `
          <div class="text-center text-red-500 p-4 border border-red-200 bg-red-50 rounded-xl">
            <p class="font-bold text-sm">Gagal Terhubung ke Database</p>
            <p class="text-xs mt-1 text-red-400">Pastikan URL Apps Script benar dan akses sudah 'Anyone'.</p>
          </div>`;
        console.error("Fetch Error:", err);
      }
    }

    // Fungsi Menampilkan Data ke HTML
    function renderData(items) {
      const container = document.getElementById('itemList');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-6 text-sm">Barang tidak ditemukan.</p>`;
        return;
      }

      items.forEach(item => {
        const stok = Number(item.Stok_Saat_Ini) || 0;
        const minStok = Number(item.Stok_Minimum) || 0;
        const modal = Number(item.Modal) || 0;
        const jual = Number(item.Harga_Jual) || 0;
        const untung = Number(item.Keuntungan) || (jual - modal);
        
        const isMenipis = stok <= minStok;

        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border transition-all ${
          isMenipis ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200 hover:border-blue-400'
        }`;
        
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800 uppercase tracking-wider mb-1">
                ${item.Jenis || 'Umum'}
              </span>
              <h2 class="font-bold text-slate-900 text-base leading-tight">
                ${item.Nama_Barang} ${item.Ukuran ? `(${item.Ukuran})` : ''}
              </h2>
              <p class="text-xs text-slate-500 mt-1">
                Modal: <span class="font-semibold text-slate-700">Rp ${modal.toLocaleString('id-ID')}</span> / ${item.Satuan || 'Pcs'}
              </p>
            </div>
            
            <div class="text-right flex-shrink-0">
              <p class="text-base font-extrabold text-emerald-600">Rp ${jual.toLocaleString('id-ID')}</p>
              <p class="text-[11px] font-medium text-slate-500 mt-0.5">
                Untung: <span class="text-blue-600 font-bold">Rp ${untung.toLocaleString('id-ID')}</span>
              </p>
            </div>
          </div>

          <div class="mt-3 pt-2.5 border-t border-slate-100 flex justify-between items-center text-xs">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full ${isMenipis ? 'bg-amber-500 animate-pulse' : 'bg-emerald-500'}"></span>
              <span class="font-semibold ${isMenipis ? 'text-amber-700 font-bold' : 'text-slate-600'}">
                Stok: ${stok} ${item.Satuan || ''} ${isMenipis ? '(Menipis!)' : ''}
              </span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Fungsi Filter Live Search
    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = masterData.filter(item => {
        const nama = (item.Nama_Barang || '').toLowerCase();
        const jenis = (item.Jenis || '').toLowerCase();
        const ukuran = (item.Ukuran || '').toLowerCase();
        return nama.includes(query) || jenis.includes(query) || ukuran.includes(query);
      });
      renderData(filtered);
    }

    // Jalankan pertama kali
    loadData();
  </script>
</body>
</html>
