<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Stok Plastik</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-5">
    <h1 class="text-xl font-bold text-blue-900 border-b pb-2 mb-4">Cek Harga & Stok Plastik</h1>
    
    <!-- Input Pencarian -->
    <input type="text" id="searchInput" onkeyup="filterBarang()" 
           placeholder="Cari barang (cth: PE, 12x22, Kharisma)..." 
           class="w-full p-2.5 border rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none">

    <!-- Loading State -->
    <div id="loading" class="text-center py-4 text-slate-500">Memuat data dari Google Sheets...</div>

    <!-- Daftar Barang -->
    <div id="itemList" class="space-y-3"></div>
  </div>

  <script>
    // Ganti dengan URL Deployment Google Apps Script Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbx8IWkOeClPY6fCJhpsyl50qO7I6dz9IjjqAOiVhWjCtawiIhj0LotfdAJFdd-_-Uwo/exec"; 
    let masterData = [];

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        masterData = await response.json();
        document.getElementById('loading').classList.add('hidden');
        renderData(masterData);
      } catch (err) {
        document.getElementById('loading').innerText = "Gagal memuat data. Periksa koneksi internet.";
      }
    }

    function renderData(items) {
      const container = document.getElementById('itemList');
      container.innerHTML = '';

      items.forEach(item => {
        const isMenipis = item.Stok_Saat_Ini <= item.Stok_Minimum;
        const card = document.createElement('div');
        card.className = `p-3 rounded-lg border ${isMenipis ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-200'}`;
        
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-100 text-blue-800">${item.Jenis}</span>
              <h2 class="font-bold text-slate-900 mt-1">${item.Nama_Barang} (${item.Ukuran})</h2>
              <p class="text-xs text-slate-500">Modal: Rp ${Number(item.Modal).toLocaleString('id-ID')} / ${item.Satuan}</p>
            </div>
            <div class="text-right">
              <p class="text-sm font-bold text-green-700">Rp ${Number(item.Harga_Jual).toLocaleString('id-ID')}</p>
              <p class="text-xs font-medium text-slate-600">Untung: Rp ${Number(item.Keuntungan).toLocaleString('id-ID')}</p>
            </div>
          </div>
          <div class="mt-2 pt-2 border-t flex justify-between items-center text-xs">
            <span class="font-semibold ${isMenipis ? 'text-red-600 font-bold' : 'text-slate-600'}">
              Stok: ${item.Stok_Saat_Ini} ${item.Satuan} ${isMenipis ? '(Menipis!)' : ''}
            </span>
            <button onclick="inputPenjualan('${item.ID_Barang}', '${item.Nama_Barang}', ${item.Harga_Jual})" 
                    class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 font-medium">
              + Jual
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterBarang() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = masterData.filter(item => 
        item.Nama_Barang.toLowerCase().includes(query) || 
        item.Jenis.toLowerCase().includes(query) ||
        item.Ukuran.toLowerCase().includes(query)
      );
      renderData(filtered);
    }

    loadData();
  </script>
</body>
</html>
